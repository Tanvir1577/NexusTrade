<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candleUp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candleDown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background - rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid lines -->
  <line x1="10" y1="48" x2="54" y2="48" stroke="#1e3a2f" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="10" y1="38" x2="54" y2="38" stroke="#1e3a2f" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="10" y1="28" x2="54" y2="28" stroke="#1e3a2f" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Candle 1 - Red (bearish) -->
  <line x1="16" y1="18" x2="16" y2="46" stroke="url(#candleDown)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <rect x="13" y="22" width="6" height="16" rx="1" fill="url(#candleDown)" opacity="0.9"/>

  <!-- Candle 2 - Red (bearish) -->
  <line x1="25" y1="20" x2="25" y2="42" stroke="url(#candleDown)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <rect x="22" y="24" width="6" height="12" rx="1" fill="url(#candleDown)" opacity="0.9"/>

  <!-- Candle 3 - Green (bullish reversal - largest) -->
  <line x1="34" y1="14" x2="34" y2="44" stroke="url(#candleUp)" stroke-width="1.5" stroke-linecap="round" filter="url(#softGlow)"/>
  <rect x="31" y="18" width="6" height="20" rx="1" fill="url(#candleUp)" filter="url(#glow)"/>

  <!-- Candle 4 - Green (bullish) -->
  <line x1="43" y1="16" x2="43" y2="40" stroke="url(#candleUp)" stroke-width="1.2" stroke-linecap="round" filter="url(#softGlow)"/>
  <rect x="40" y="19" width="6" height="14" rx="1" fill="url(#candleUp)" filter="url(#softGlow)"/>

  <!-- Candle 5 - Green (bullish) -->
  <line x1="52" y1="12" x2="52" y2="36" stroke="url(#candleUp)" stroke-width="1.2" stroke-linecap="round" filter="url(#softGlow)"/>
  <rect x="49" y="15" width="6" height="13" rx="1" fill="url(#candleUp)" filter="url(#softGlow)"/>

  <!-- Signal arrow pointing up-right -->
  <path d="M46 8 L50 4 L50 6.5 L54 6.5 L54 9.5 L50 9.5 L50 12 Z" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.95"/>
</svg>
