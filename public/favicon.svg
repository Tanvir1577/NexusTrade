<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Outer glow circle -->
  <circle cx="256" cy="248" r="140" fill="none" stroke="#10b981" stroke-opacity="0.06" stroke-width="40"/>

  <!-- Lightning bolt (main icon) -->
  <g filter="url(#shadow)">
    <path d="
      M 296 108
      L 228 256
      L 276 256
      L 232 388
      L 316 228
      L 266 228
      Z
    " fill="url(#bolt)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  </g>

  <!-- Upward trend arrow integrated -->
  <g filter="url(#innerGlow)">
    <path d="
      M 164 352
      L 210 308
      L 234 328
      L 280 278
    " fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35"/>
    <path d="
      M 280 278
      L 268 282
      L 278 296
    " fill="#10b981" fill-opacity="0.35"/>
  </g>

  <!-- Three candlestick bars bottom-left accent -->
  <g opacity="0.15">
    <line x1="140" y1="400" x2="140" y2="358" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <rect x="132" y="370" width="16" height="20" rx="2" fill="#10b981"/>

    <line x1="162" y1="395" x2="162" y2="348" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
    <rect x="154" y="358" width="16" height="24" rx="2" fill="#ef4444"/>

    <line x1="184" y1="390" x2="184" y2="352" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <rect x="176" y="360" width="16" height="18" rx="2" fill="#10b981"/>
  </g>

  <!-- Subtle N letter watermark -->
  <text x="348" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#10b981" fill-opacity="0.08" letter-spacing="-2">N</text>
</svg>
