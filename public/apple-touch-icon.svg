<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candleUp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candleDown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="172" height="172" rx="38" ry="38" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Grid lines -->
  <line x1="28" y1="138" x2="152" y2="138" stroke="#1e3a2f" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="28" y1="108" x2="152" y2="108" stroke="#1e3a2f" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="28" y1="78" x2="152" y2="78" stroke="#1e3a2f" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Candle 1 - Red -->
  <line x1="44" y1="48" x2="44" y2="130" stroke="url(#candleDown)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <rect x="37" y="62" width="14" height="42" rx="2.5" fill="url(#candleDown)" opacity="0.9"/>

  <!-- Candle 2 - Red -->
  <line x1="68" y1="55" x2="68" y2="118" stroke="url(#candleDown)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <rect x="61" y="66" width="14" height="32" rx="2.5" fill="url(#candleDown)" opacity="0.9"/>

  <!-- Candle 3 - Green (reversal) -->
  <line x1="92" y1="38" x2="92" y2="125" stroke="url(#candleUp)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="85" y="48" width="14" height="55" rx="2.5" fill="url(#candleUp)" filter="url(#glow)"/>

  <!-- Candle 4 - Green -->
  <line x1="116" y1="42" x2="116" y2="112" stroke="url(#candleUp)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="109" y="50" width="14" height="40" rx="2.5" fill="url(#candleUp)" filter="url(#glow)"/>

  <!-- Candle 5 - Green -->
  <line x1="140" y1="32" x2="140" y2="100" stroke="url(#candleUp)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="133" y="40" width="14" height="38" rx="2.5" fill="url(#candleUp)" filter="url(#glow)"/>

  <!-- Signal arrow -->
  <path d="M128 22 L140 10 L140 17 L155 17 L155 27 L140 27 L140 34 Z" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.95"/>
</svg>
